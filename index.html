<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy AI Voice Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f17; color: #f3f4f6; font-family: sans-serif; }
        .box { background: rgba(17, 24, 39, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col justify-between max-w-xl mx-auto">

    <!-- Header -->
    <header class="text-center mb-6">
        <h1 class="text-xl font-bold text-amber-400">Easy AI Voice Studio</h1>
        <p class="text-xs text-gray-400">Simple, Fast & 100% Working Buttons</p>
    </header>

    <!-- Main Section -->
    <main class="flex flex-col gap-4 flex-1">
        
        <!-- Script Box -->
        <div class="box rounded-2xl p-4 shadow-lg">
            <label class="block text-xs font-semibold text-gray-300 mb-2">Apni Script Yahan Likhein:</label>
            <textarea id="scriptInput" rows="4" placeholder="Kuch bhi likhein (Hindi ya English)..." class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-amber-500 text-sm"></textarea>
            <div class="text-right text-[10px] text-gray-500 mt-1" id="charCount">0 characters</div>
        </div>

        <!-- Voice & Speed Settings -->
        <div class="box rounded-2xl p-4 shadow-lg flex flex-col gap-3">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Voice Type Chunein:</label>
                <select id="voiceType" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-sm text-gray-200 focus:outline-none focus:border-amber-500">
                    <option value="female">Natural Female Voice (Mahila Awaaz)</option>
                    <option value="male">Natural Male Voice (Purush Awaaz)</option>
                </select>
            </div>

            <div>
                <div class="flex justify-between text-xs text-gray-300 mb-1">
                    <span>Speed (Bolne ki Raftaar):</span>
                    <span id="speedText" class="text-amber-400 font-bold">1.0x</span>
                </div>
                <input type="range" id="speedRange" min="0.5" max="1.5" step="0.1" value="1.0" class="w-full accent-amber-500">
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="speakText('hi')" class="py-3 px-4 bg-orange-600 hover:bg-orange-500 text-white font-semibold rounded-xl shadow transition text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-volume-high"></i> Hindi Me Bole
            </button>
            <button onclick="speakText('en')" class="py-3 px-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl shadow transition text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-language"></i> English Me Bole
            </button>
        </div>

        <!-- Stop Button -->
        <button onclick="stopSpeech()" class="py-2.5 px-4 bg-red-950/50 hover:bg-red-900 text-red-400 border border-red-800/50 rounded-xl transition text-xs flex items-center justify-center gap-2">
            <i class="fa-solid fa-square"></i> Audio Roko (Stop)
        </button>

    </main>

    <footer class="text-center text-[10px] text-gray-600 mt-6">
        Easy Voice App • No Complicated Setup
    </footer>

    <!-- Simple Script -->
    <script>
        const scriptInput = document.getElementById('scriptInput');
        const charCount = document.getElementById('charCount');
        const speedRange = document.getElementById('speedRange');
        const speedText = document.getElementById('speedText');

        speedRange.addEventListener('input', (e) => {
            speedText.innerText = e.target.value + 'x';
        });

        scriptInput.addEventListener('input', () => {
            charCount.innerText = scriptInput.value.length + ' characters';
        });

        async function translateText(text, targetLang) {
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                let translated = "";
                data[0].forEach(item => { if (item[0]) translated += item[0]; });
                return translated;
            } catch (err) {
                return text;
            }
        }

        async function speakText(targetLang) {
            const text = scriptInput.value.trim();
            if (!text) {
                alert('Kripya pehle kuch script ya text likhein!');
                return;
            }

            window.speechSynthesis.cancel();

            // Auto-translate text
            const translated = await translateText(text, targetLang);

            const utterance = new SpeechSynthesisUtterance(translated);
            utterance.lang = targetLang === 'hi' ? 'hi-IN' : 'en-US';
            utterance.rate = parseFloat(speedRange.value);

            const voiceType = document.getElementById('voiceType').value;
            if (voiceType === 'female') {
                utterance.pitch = 1.2; // Higher pitch for female tone
            } else {
                utterance.pitch = 0.8; // Lower pitch for male tone
            }

            // Select best available voice from device
            const voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                const found = voices.find(v => v.lang.toLowerCase().includes(targetLang === 'hi' ? 'hi' : 'en'));
                if (found) utterance.voice = found;
            }

            window.speechSynthesis.speak(utterance);
        }

        function stopSpeech() {
            window.speechSynthesis.cancel();
        }
    </script>
</body>
</html>
