<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Human Voice Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .glass-card {
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Header -->
    <header class="max-w-2xl mx-auto w-full flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-500 to-amber-400 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-orange-500/20">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    AI Human Voice <span class="text-xs bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded-full border border-orange-500/30">EXPRESS</span>
                </h1>
                <p class="text-xs text-gray-400">Instant Human Speech Generator</p>
            </div>
        </div>
        <div id="statusBadge" class="hidden text-xs bg-blue-500/10 text-blue-400 px-3 py-1 rounded-full border border-blue-500/20 items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-blue-400 animate-ping"></span>
            <span id="statusText">Processing...</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto w-full flex-1 flex flex-col gap-5">
        
        <!-- Text Input Section -->
        <div class="glass-card rounded-2xl p-4 shadow-xl">
            <textarea id="scriptInput" rows="5" placeholder="Apni script yahan likhein (Write your script here)..." class="w-full bg-transparent text-gray-100 placeholder-gray-500 resize-none focus:outline-none text-base md:text-lg"></textarea>
            <div class="flex justify-between items-center pt-3 border-t border-gray-800 text-xs text-gray-400">
                <span id="charCount">0 / 3000 characters</span>
                <span class="flex items-center gap-1 text-amber-400"><i class="fa-solid fa-wand-magic-sparkles"></i> Auto-Human Pitch Tuned</span>
            </div>
        </div>

        <!-- Main Fast Action Buttons -->
        <div class="flex flex-col gap-3">
            <!-- Hindi Button -->
            <button onclick="speakText('hi-IN')" class="w-full py-4 px-6 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 active:scale-[0.99] text-white font-semibold rounded-2xl shadow-lg shadow-orange-600/25 transition-all flex items-center justify-center gap-3 text-lg">
                <i class="fa-solid fa-volume-high text-xl"></i>
                <div class="text-left">
                    <div class="text-xs opacity-80 uppercase tracking-wider">Click to Speak in</div>
                    <div>Hindi (हिंदी में बोले)</div>
                </div>
            </button>

            <!-- English Button -->
            <button onclick="speakText('en-US')" class="w-full py-4 px-6 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-[0.99] text-white font-semibold rounded-2xl shadow-lg shadow-blue-600/25 transition-all flex items-center justify-center gap-3 text-lg">
                <i class="fa-solid fa-language text-xl"></i>
                <div class="text-left">
                    <div class="text-xs opacity-80 uppercase tracking-wider">Click to Speak in</div>
                    <div>English (इंग्लिश में बोले)</div>
                </div>
            </button>
        </div>

        <!-- Language Dropdown Button -->
        <div class="relative">
            <button onclick="toggleLangModal()" class="w-full py-3 px-4 glass-card hover:bg-gray-800/60 text-gray-300 font-medium rounded-xl transition flex items-center justify-center gap-2 text-sm border border-gray-700/50">
                <i class="fa-solid fa-globe text-amber-400"></i>
                <span id="selectedLangName">All Languages / दुनिया की दूसरी भाषाएं चुनें</span>
                <i class="fa-solid fa-chevron-down text-xs ml-1"></i>
            </button>

            <!-- Language Search Modal -->
            <div id="langModal" class="hidden absolute top-full left-0 right-0 mt-2 glass-card rounded-xl p-3 shadow-2xl z-50 border border-gray-700">
                <input type="text" id="langSearch" oninput="filterLanguages()" placeholder="Search language (e.g. Spanish, Marathi)..." class="w-full bg-gray-900/80 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-amber-500 mb-2">
                <div id="langList" class="max-h-48 overflow-y-auto space-y-1 text-sm">
                    <!-- Languages rendered dynamically -->
                </div>
            </div>
        </div>

        <!-- Audio Player & Visualizer Card -->
        <div class="glass-card rounded-2xl p-4 flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2 text-xs font-medium text-emerald-400">
                    <span id="visualizerDot" class="w-2 h-2 rounded-full bg-emerald-400 opacity-40"></span>
                    <span id="audioStatus">Audio Ready</span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="pauseSpeech()" class="p-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-xs transition" title="Pause"><i class="fa-solid fa-pause"></i></button>
                    <button onclick="stopSpeech()" class="p-2 bg-red-950/40 hover:bg-red-900/60 text-red-400 rounded-lg text-xs transition" title="Stop"><i class="fa-solid fa-square"></i></button>
                </div>
            </div>

            <!-- Waveform Canvas -->
            <div class="h-16 bg-gray-950/60 rounded-xl overflow-hidden relative flex items-center justify-center border border-gray-800/80">
                <canvas id="waveformCanvas" class="w-full h-full"></canvas>
            </div>
        </div>

    </main>

    <footer class="max-w-2xl mx-auto w-full text-center text-xs text-gray-600 mt-6">
        AI Human Voice Express • Real-time Speech Engine
    </footer>

    <!-- JavaScript Engine -->
    <script>
        const scriptInput = document.getElementById('scriptInput');
        const charCount = document.getElementById('charCount');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const visualizerDot = document.getElementById('visualizerDot');
        const audioStatus = document.getElementById('audioStatus');
        const canvas = document.getElementById('waveformCanvas');
        const ctx = canvas.getContext('2d');

        let synth = window.speechSynthesis;
        let voices = [];

        // Available languages list
        const languages = [
            { code: 'hi-IN', name: 'Hindi (हिंदी)' },
            { code: 'en-US', name: 'English (US)' },
            { code: 'en-IN', name: 'English (India)' },
            { code: 'bn-IN', name: 'Bengali (বাংলা)' },
            { code: 'mr-IN', name: 'Marathi (मराठी)' },
            { code: 'ta-IN', name: 'Tamil (தமிழ்)' },
            { code: 'te-IN', name: 'Telugu (తెలుగు)' },
            { code: 'gu-IN', name: 'Gujarati (ગુજરાતી)' },
            { code: 'es-ES', name: 'Spanish (Español)' },
            { code: 'fr-FR', name: 'French (Français)' },
            { code: 'de-DE', name: 'German (Deutsch)' },
            { code: 'ar-SA', name: 'Arabic (العربية)' },
            { code: 'zh-CN', name: 'Chinese (中文)' },
            { code: 'ja-JP', name: 'Japanese (日本語)' },
            { code: 'ru-RU', name: 'Russian (Русский)' }
        ];

        // Load voices
        function loadVoices() {
            voices = synth.getVoices();
        }
        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        // Character Counter
        scriptInput.addEventListener('input', () => {
            charCount.innerText = `${scriptInput.value.length} / 3000 characters`;
        });

        // Toggle Language Modal
        function toggleLangModal() {
            const modal = document.getElementById('langModal');
            modal.classList.toggle('hidden');
            if(!modal.classList.contains('hidden')) {
                renderLanguageList(languages);
            }
        }

        function renderLanguageList(list) {
            const container = document.getElementById('langList');
            container.innerHTML = list.map(l => `
                <div onclick="selectLanguage('${l.code}', '${l.name}')" class="p-2 hover:bg-gray-800 rounded-lg cursor-pointer text-gray-300 flex justify-between items-center">
                    <span>${l.name}</span>
                    <span class="text-xs text-gray-500">${l.code}</span>
                </div>
            `).join('');
        }

        function filterLanguages() {
            const query = document.getElementById('langSearch').value.toLowerCase();
            const filtered = languages.filter(l => l.name.toLowerCase().includes(query) || l.code.toLowerCase().includes(query));
            renderLanguageList(filtered);
        }

        function selectLanguage(code, name) {
            document.getElementById('selectedLangName').innerText = name;
            toggleLangModal();
            speakText(code);
        }

        // Main Speech Function (Instant Play)
        function speakText(langCode) {
            const text = scriptInput.value.trim();
            if (!text) {
                alert('Kripya pehle script likhein! (Please enter a script first!)');
                return;
            }

            synth.cancel(); // Stop any ongoing speech

            showStatus('Speaking...');
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode;

            // Pitch & Rate Tuning for Natural Human Sound
            utterance.pitch = 1.0;
            utterance.rate = 0.95; 

            // Find best matching voice
            if (voices.length > 0) {
                const matchedVoice = voices.find(v => v.lang.includes(langCode) || v.lang.replace('_', '-').includes(langCode));
                if (matchedVoice) {
                    utterance.voice = matchedVoice;
                }
            }

            utterance.onstart = () => {
                visualizerDot.classList.add('animate-pulse', 'opacity-100');
                audioStatus.innerText = 'Playing Speech...';
                startWaveform();
            };

            utterance.onend = () => {
                hideStatus();
                visualizerDot.classList.remove('animate-pulse', 'opacity-100');
                audioStatus.innerText = 'Audio Ready';
                stopWaveform();
            };

            utterance.onerror = () => {
                hideStatus();
                audioStatus.innerText = 'Speech Error';
                stopWaveform();
            };

            synth.speak(utterance);
        }

        function pauseSpeech() {
            if (synth.speaking && !synth.paused) {
                synth.pause();
                audioStatus.innerText = 'Paused';
            } else if (synth.paused) {
                synth.resume();
                audioStatus.innerText = 'Playing Speech...';
            }
        }

        function stopSpeech() {
            synth.cancel();
            hideStatus();
            audioStatus.innerText = 'Stopped';
                stopWaveform();
        }

        function showStatus(msg) {
            statusBadge.classList.remove('hidden');
            statusBadge.classList.add('flex');
            statusText.innerText = msg;
        }

        function hideStatus() {
            statusBadge.classList.add('hidden');
            statusBadge.classList.remove('flex');
        }

        // Simple Waveform Visualizer
        let animId = null;
        function startWaveform() {
            let offset = 0;
            function draw() {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath();
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 2;
                for (let x = 0; x < canvas.width; x++) {
                    let y = canvas.height / 2 + Math.sin(x * 0.05 + offset) * 12 * Math.sin(x * 0.01);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
                offset += 0.15;
                animId = requestAnimationFrame(draw);
            }
            draw();
        }

        function stopWaveform() {
            if (animId) cancelAnimationFrame(animId);
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = '#374151';
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
        }
    </script>
</body>
</html>
