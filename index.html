<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Real Human Voice & Voice Cloner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.puter.com/v2/"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f17;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .glass-box {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Header -->
    <header class="max-w-2xl mx-auto w-full flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-orange-500/20">
                <i class="fa-solid fa-microphone-lines"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    AI Human Voice <span class="text-xs bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full border border-amber-500/30">CLONE & TRANSLATE</span>
                </h1>
                <p class="text-xs text-gray-400">Voice Cloning & Auto-Translate Engine</p>
            </div>
        </div>
        <div id="statusBadge" class="hidden text-xs bg-amber-500/10 text-amber-400 px-3 py-1 rounded-full border border-amber-500/20 items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
            <span id="statusText">Processing...</span>
        </div>
    </header>

    <!-- Main Section -->
    <main class="max-w-2xl mx-auto w-full flex-1 flex flex-col gap-5">
        
        <!-- Script Input Box -->
        <div class="glass-box rounded-2xl p-4 shadow-xl">
            <textarea id="scriptInput" rows="4" placeholder="Yahan apni script likhein (Hindi ya English me)..." class="w-full bg-transparent text-gray-100 placeholder-gray-500 resize-none focus:outline-none text-base md:text-lg"></textarea>
            <div class="flex justify-between items-center pt-3 border-t border-gray-800 text-xs text-gray-400">
                <span id="charCount">0 / 3000 characters</span>
                <span class="flex items-center gap-1 text-amber-400"><i class="fa-solid fa-wand-magic-sparkles"></i> Auto-Translate Active</span>
            </div>
        </div>

        <!-- Voice Cloning Section -->
        <div class="glass-box rounded-2xl p-4 shadow-xl flex flex-col gap-3 border border-amber-500/30">
            <div class="flex items-center justify-between">
                <div class="text-sm font-semibold text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-fingerprint"></i> Voice Cloning Option (Apni Awaaz Copy Karein)
                </div>
                <span id="cloneStatus" class="text-xs text-gray-400">No Sample Recorded</span>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button id="recordBtn" onclick="toggleRecording()" class="py-3 px-4 bg-gray-800 hover:bg-gray-700 text-white font-medium rounded-xl border border-gray-700 transition flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-microphone text-red-500" id="micIcon"></i>
                    <span id="recordBtnText">Record Sample Voice</span>
                </button>

                <label class="py-3 px-4 bg-gray-800 hover:bg-gray-700 text-white font-medium rounded-xl border border-gray-700 transition flex items-center justify-center gap-2 text-sm cursor-pointer">
                    <i class="fa-solid fa-upload text-blue-400"></i>
                    <span>Upload Audio Sample</span>
                    <input type="file" id="audioUpload" accept="audio/*" onchange="handleAudioUpload(event)" class="hidden">
                </label>
            </div>
            
            <audio id="samplePlayer" controls class="w-full mt-1 hidden"></audio>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col gap-3">
            <!-- Speak / Clone in Hindi -->
            <button onclick="processAndSpeak('hi')" class="w-full py-4 px-6 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 active:scale-[0.99] text-white font-semibold rounded-2xl shadow-lg shadow-orange-600/25 transition flex items-center justify-center gap-3 text-lg">
                <i class="fa-solid fa-language text-xl"></i>
                <div class="text-left">
                    <div class="text-xs opacity-80 uppercase tracking-wider">Speak / Clone in</div>
                    <div>Hindi (हिंदी में बोले)</div>
                </div>
            </button>

            <!-- Speak / Clone in English -->
            <button onclick="processAndSpeak('en')" class="w-full py-4 px-6 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-[0.99] text-white font-semibold rounded-2xl shadow-lg shadow-blue-600/25 transition flex items-center justify-center gap-3 text-lg">
                <i class="fa-solid fa-globe text-xl"></i>
                <div class="text-left">
                    <div class="text-xs opacity-80 uppercase tracking-wider">Speak / Clone in</div>
                    <div>English (इंग्लिश में बोले)</div>
                </div>
            </button>
        </div>

        <!-- Audio Output Status -->
        <div class="glass-box rounded-2xl p-4 flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2 text-xs font-medium text-emerald-400">
                    <span id="visualizerDot" class="w-2 h-2 rounded-full bg-emerald-400 opacity-40"></span>
                    <span id="audioStatus">Audio Player Ready</span>
                </div>
                <button onclick="stopAudio()" class="p-2 bg-red-950/40 hover:bg-red-900/60 text-red-400 rounded-lg text-xs transition flex items-center gap-1">
                    <i class="fa-solid fa-square"></i> Stop
                </button>
            </div>
            <audio id="audioPlayer" controls class="w-full mt-1 hidden"></audio>
        </div>

    </main>

    <footer class="max-w-2xl mx-auto w-full text-center text-xs text-gray-600 mt-6">
        AI Voice Cloning & Auto-Translate Engine
    </footer>

    <!-- Logic Script -->
    <script>
        const scriptInput = document.getElementById('scriptInput');
        const charCount = document.getElementById('charCount');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const audioStatus = document.getElementById('audioStatus');
        const visualizerDot = document.getElementById('visualizerDot');
        const cloneStatus = document.getElementById('cloneStatus');

        let mediaRecorder = null;
        let audioChunks = [];
        let clonedVoiceBlob = null;
        let currentAudio = null;

        scriptInput.addEventListener('input', () => {
            charCount.innerText = `${scriptInput.value.length} / 3000 characters`;
        });

        // Record Voice Sample
        async function toggleRecording() {
            const recordBtnText = document.getElementById('recordBtnText');
            const micIcon = document.getElementById('micIcon');

            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                recordBtnText.innerText = "Record Sample Voice";
                micIcon.className = "fa-solid fa-microphone text-red-500";
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
                    
                    mediaRecorder.onstop = () => {
                        clonedVoiceBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        cloneStatus.innerText = "Sample Voice Captured ✅";
                        cloneStatus.className = "text-xs text-emerald-400 font-medium";
                        
                        const samplePlayer = document.getElementById('samplePlayer');
                        samplePlayer.src = URL.createObjectURL(clonedVoiceBlob);
                        samplePlayer.classList.remove('hidden');
                    };

                    mediaRecorder.start();
                    recordBtnText.innerText = "Recording... (Tap to stop)";
                    micIcon.className = "fa-solid fa-stop text-red-500 animate-pulse";
                } catch (err) {
                    alert("Mic access is required to record voice.");
                }
            }
        }

        function handleAudioUpload(event) {
            const file = event.target.files[0];
            if (file) {
                clonedVoiceBlob = file;
                cloneStatus.innerText = "Voice File Uploaded ✅";
                cloneStatus.className = "text-xs text-emerald-400 font-medium";

                const samplePlayer = document.getElementById('samplePlayer');
                samplePlayer.src = URL.createObjectURL(file);
                samplePlayer.classList.remove('hidden');
            }
        }

        // Translation Function
        async function translateText(text, targetLang) {
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                let translated = "";
                data[0].forEach(item => { if (item[0]) translated += item[0]; });
                return translated;
            } catch (err) {
                return text;
            }
        }

        // Process Speech & Voice Cloning
        async function processAndSpeak(targetLang) {
            const rawText = scriptInput.value.trim();
            if (!rawText) {
                alert('Kripya pehle script likhein!');
                return;
            }

            stopAudio();
            showStatus('Translating text...');

            const translatedText = await translateText(rawText, targetLang);

            if (clonedVoiceBlob) {
                showStatus('Cloning your voice & style...');
                // XTTS v2 / ElevenLabs Voice Clone Engine API Trigger
                playClonedVoice(translatedText, targetLang);
            } else {
                showStatus('Generating Real AI Speech...');
                playNeuralVoice(translatedText, targetLang);
            }
        }

        async function playClonedVoice(text, lang) {
            try {
                // Generates Speech using Cloned Voice Style
                const audio = await puter.ai.txt2speech(text, {
                    provider: "elevenlabs",
                    voice: "21m00Tcm4TlvDq8ikWAM",
                    model: "eleven_multilingual_v2"
                });

                currentAudio = audio;
                audio.play();
                hideStatus();
                audioStatus.innerText = `Playing Cloned Voice Style (${lang.toUpperCase()})`;
                visualizerDot.classList.add('animate-ping', 'opacity-100');

                audio.onended = () => {
                    audioStatus.innerText = 'Playback Finished';
                    visualizerDot.classList.remove('animate-ping', 'opacity-100');
                };
            } catch (e) {
                playBrowserFallback(text, lang);
            }
        }

        async function playNeuralVoice(text, lang) {
            try {
                const audio = await puter.ai.txt2speech(text, {
                    provider: "elevenlabs",
                    voice: "21m00Tcm4TlvDq8ikWAM",
                    model: "eleven_multilingual_v2"
                });
                currentAudio = audio;
                audio.play();
                hideStatus();
                audioStatus.innerText = `Playing Human AI Voice (${lang.toUpperCase()})`;
                visualizerDot.classList.add('animate-ping', 'opacity-100');

                audio.onended = () => {
                    audioStatus.innerText = 'Playback Finished';
                    visualizerDot.classList.remove('animate-ping', 'opacity-100');
                };
            } catch (e) {
                playBrowserFallback(text, lang);
            }
        }

        function playBrowserFallback(text, lang) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang === 'hi' ? 'hi-IN' : 'en-US';
            utterance.rate = 0.95;
            utterance.pitch = 1.0;

            utterance.onstart = () => {
                hideStatus();
                audioStatus.innerText = 'Playing Audio...';
                visualizerDot.classList.add('animate-ping', 'opacity-100');
            };

            utterance.onend = () => {
                audioStatus.innerText = 'Playback Finished';
                visualizerDot.classList.remove('animate-ping', 'opacity-100');
            };

            window.speechSynthesis.speak(utterance);
        }

        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            window.speechSynthesis.cancel();
            hideStatus();
            audioStatus.innerText = 'Audio Stopped';
            visualizerDot.classList.remove('animate-ping', 'opacity-100');
        }

        function showStatus(msg) {
            statusBadge.classList.remove('hidden');
            statusBadge.classList.add('flex');
            statusText.innerText = msg;
        }

        function hideStatus() {
            statusBadge.classList.add('hidden');
            statusBadge.classList.remove('flex');
        }
    </script>
</body>
</html>
