<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure & Free AI Voice Cloning Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f17; color: #f3f4f6; font-family: system-ui, sans-serif; }
        .glass-box { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 max-w-3xl mx-auto flex flex-col justify-between">

    <header class="text-center mb-6">
        <h1 class="text-2xl font-bold text-amber-400 flex items-center justify-center gap-2">
            <i class="fa-solid fa-shield-halved"></i> Private AI Voice Dubbing Engine
        </h1>
        <p class="text-xs text-gray-400 mt-1">100% Free & Secure Token-Authenticated Processing</p>
    </header>

    <main class="flex flex-col gap-5">

        <!-- Script Input -->
        <div class="glass-box rounded-2xl p-4 shadow-xl">
            <label class="block text-xs font-semibold text-gray-300 mb-2">1. Apni Script Likhein:</label>
            <textarea id="scriptInput" rows="4" placeholder="Jo bulwana chahte hain yahan likhein..." class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-amber-500"></textarea>
        </div>

        <!-- Voice Sample Capture -->
        <div class="glass-box rounded-2xl p-4 shadow-xl border border-amber-500/30">
            <label class="block text-xs font-semibold text-amber-400 mb-2">2. Voice Sample (Temporary In-Memory):</label>
            
            <div class="grid grid-cols-2 gap-3 mb-3">
                <button id="recordBtn" onclick="toggleRecording()" class="py-3 px-3 bg-gray-800 hover:bg-gray-700 text-white font-medium rounded-xl border border-gray-700 text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-microphone text-red-500" id="micIcon"></i>
                    <span id="recordText">Record Sample</span>
                </button>

                <label class="py-3 px-3 bg-gray-800 hover:bg-gray-700 text-white font-medium rounded-xl border border-gray-700 text-xs flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-upload text-blue-400"></i> Upload Audio
                    <input type="file" id="audioFileInput" accept="audio/*" onchange="handleFileUpload(event)" class="hidden">
                </label>
            </div>

            <div id="samplePreview" class="hidden bg-gray-900 p-2 rounded-xl border border-gray-800">
                <span class="text-[10px] text-emerald-400 block mb-1">Voice Sample Loaded ✅</span>
                <audio id="samplePlayer" controls class="w-full h-8"></audio>
            </div>
        </div>

        <!-- Generate Button -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="generateSecureDubbing()" class="col-span-2 py-3.5 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white font-bold rounded-xl text-sm shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Exact Voice Clone & Dubbing
            </button>
        </div>

        <!-- Output Player & Local Storage Options -->
        <div class="glass-box rounded-2xl p-4 flex flex-col gap-3">
            <div class="flex justify-between items-center text-xs">
                <span id="statusText" class="text-emerald-400 font-medium">Ready</span>
            </div>
            
            <audio id="outputAudioPlayer" controls class="w-full hidden"></audio>

            <div id="saveActionBox" class="hidden grid grid-cols-2 gap-3 pt-2 border-t border-gray-800">
                <button onclick="saveDubbingLocally()" class="py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Save In Phone
                </button>
                <a id="downloadBtn" download="my_dubbing.mp3" class="py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold rounded-xl text-xs flex items-center justify-center gap-2 text-center">
                    <i class="fa-solid fa-download"></i> Download MP3
                </a>
            </div>
        </div>

        <!-- Saved Dubbings Local List -->
        <div class="glass-box rounded-2xl p-4">
            <h3 class="text-xs font-bold text-amber-400 mb-2 flex items-center gap-2">
                <i class="fa-solid fa-list"></i> My Saved Dubbings (Local Device Storage)
            </h3>
            <div id="savedDubbingsList" class="space-y-2 max-h-40 overflow-y-auto text-xs text-gray-400"></div>
        </div>

    </main>

    <script>
        // Aapka Hugging Face Access Token yahan set kar diya gaya hai
        const HUGGINGFACE_SECRET_TOKEN = "Hf_TrSNuXfVytijhlBKxasveMPgHXaomHCduQ"; 
        
        // Coqui XTTS v2 Free Serverless Model Endpoint
        const API_URL = "https://api-inference.huggingface.co/models/coqui/XTTS-v2";

        let mediaRecorder = null, audioChunks = [], userAudioBlob = null, currentGeneratedAudioUrl = null, db = null;

        // IndexedDB initialization for local device saving
        const request = indexedDB.open('SecureVoiceDubbingDB', 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if(!db.objectStoreNames.contains('dubbings')) {
                db.createObjectStore('dubbings', { keyPath: 'id', autoIncrement: true });
            }
        };
        request.onsuccess = (e) => { db = e.target.result; loadSavedDubbings(); };

        async function toggleRecording() {
            const btnText = document.getElementById('recordText');
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                btnText.innerText = "Record Sample";
            } else {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    userAudioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    document.getElementById('samplePlayer').src = URL.createObjectURL(userAudioBlob);
                    document.getElementById('samplePreview').classList.remove('hidden');
                };
                mediaRecorder.start();
                btnText.innerText = "Recording... (Stop)";
            }
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (file) {
                userAudioBlob = file;
                document.getElementById('samplePlayer').src = URL.createObjectURL(file);
                document.getElementById('samplePreview').classList.remove('hidden');
            }
        }

        async function generateSecureDubbing() {
            const script = document.getElementById('scriptInput').value.trim();
            const statusText = document.getElementById('statusText');

            if (!script || !userAudioBlob) return alert('Script aur Voice sample dono dena zaroori hai!');

            statusText.innerText = 'Encrypting & Processing Secure Dubbing...';

            try {
                const buffer = await userAudioBlob.arrayBuffer();

                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${HUGGINGFACE_SECRET_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        inputs: script,
                        parameters: {
                            speaker_wav: Array.from(new Uint8Array(buffer))
                        }
                    })
                });

                if (!response.ok) throw new Error('API request failed');

                const audioBlob = await response.blob();
                currentGeneratedAudioUrl = URL.createObjectURL(audioBlob);

                const player = document.getElementById('outputAudioPlayer');
                player.src = currentGeneratedAudioUrl;
                player.classList.remove('hidden');
                player.play();

                document.getElementById('downloadBtn').href = currentGeneratedAudioUrl;
                document.getElementById('saveActionBox').classList.remove('hidden');
                statusText.innerText = 'Dubbing Complete! Server memory wiped securely. ✅';

                // SECURITY: Auto-clear sample from volatile memory
                userAudioBlob = null;

            } catch (err) {
                statusText.innerText = 'Error! Token ya Audio Format check karein.';
            }
        }

        function saveDubbingLocally() {
            if (!currentGeneratedAudioUrl) return;
            const title = prompt("Dubbing Ka Naam:", "My Private Dubbing");
            if (!title) return;

            const tx = db.transaction('dubbings', 'readwrite');
            tx.objectStore('dubbings').add({
                title: title,
                audioUrl: currentGeneratedAudioUrl,
                date: new Date().toLocaleDateString()
            });

            tx.oncomplete = () => {
                alert('Dubbing aapke phone/browser me successfully save ho gayi!');
                loadSavedDubbings();
            };
        }

        function loadSavedDubbings() {
            if (!db) return;
            const tx = db.transaction('dubbings', 'readonly');
            tx.objectStore('dubbings').getAll().onsuccess = (e) => {
                const files = e.target.result;
                const container = document.getElementById('savedDubbingsList');
                if(files.length === 0) {
                    container.innerHTML = `<p class="italic text-gray-600 text-center">Koi saved dubbing nahi hai.</p>`;
                    return;
                }
                container.innerHTML = files.map(f => `
                    <div class="p-2 bg-gray-900 rounded-xl border border-gray-800 flex justify-between items-center">
                        <div>
                            <div class="font-semibold text-amber-300">${f.title}</div>
                            <div class="text-[10px] text-gray-500">${f.date}</div>
                        </div>
                        <audio src="${f.audioUrl}" controls class="h-7 w-36"></audio>
                    </div>
                `).join('');
            };
        }
    </script>
</body>
</html>
